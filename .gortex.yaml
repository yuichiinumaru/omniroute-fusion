# Gortex — track ONLY ./omniroute-2 (never monorepo root ganthritor/).
# Product source: src/, open-sse/, bin/, @omniroute/. Keep excludes aggressive.
workspace: omniroute-2
index:
  languages: [typescript, javascript]
  workers: 4
  exclude:
    # Deps / builds
    - "node_modules/**"
    - "**/node_modules/**"
    - ".build/**"
    - "dist/**"
    - ".next/**"
    - "coverage/**"
    - ".coverage/**"
    - "electron/dist/**"
    - "electron/dist-electron/**"
    - "electron/node_modules/**"
    - "**/*.map"
    - "**/*.min.js"
    - "*.tsbuildinfo"
    - "package-lock.json"
    # Runtime / secrets / DB dumps (disk landmines)
    - "data/**"
    - "data-*/**"
    - ".data/**"
    - "logs/**"
    - "**/*.sqlite"
    - "**/*.sqlite-*"
    - "**/*.db"
    - "server.env"
    # Test / e2e bulk (product graph only)
    - "tests/**"
    - "playwright-report/**"
    - "test-results/**"
    - "blob-report/**"
    - ".stryker-tmp/**"
    - "reports/mutation/**"
    # Docs / dumps / media
    - "docs/**"
    - "visual-reference/**"
    - "references/**"
    - "_references/**"
    - "_tasks/**"
    - "_cache/**"
    - "_mono_repo/**"
    - "scripts/**"
    - "public/**"
    - "images/**"
    - "graphify-out/**"
    - "**/graphify-out/**"
    - "CHANGELOG*.md"
    - ".changelog/**"
    # Tooling / VCS / scratch
    - ".agents/**"
    - ".archive/**"
    - ".claude/**"
    - ".gemini/**"
    - ".serena/**"
    - ".worktrees/**"
    - ".gitnexus/**"
    - ".omc/**"
    - "tmp/**"
    - ".tmp/**"
    - "~/**"
    - "**/.git/**"
    - "**/*.log"
    - "**/*.png"
    - "**/*.jpg"
    - "**/*.ico"
    - "**/*.wasm"
    - "**/*.node"
